services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: desk
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: desk
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desk -d desk"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://desk:desk@db:5432/desk
      JWT_SECRET: change-me-in-development-use-a-long-random-secret-123456789
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./candidate-pack/seed:/seed:ro

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
